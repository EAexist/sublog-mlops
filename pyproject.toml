[project]
name = "llm-benchmark"
version = "0.1.0"
description = "MLOps portfolio: LLM eval dataset synthesis, multi-model benchmark (correctness/latency/cost), scoring and reporting. Orchestrated by Apache Airflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "typer[all]>=0.12",
    "pyyaml>=6.0",
    "mlflow>=2.0",
    "apache-airflow>=2.8",
    "openai>=1.0",
    "google-generativeai>=0.8",
    "streamlit>=1.28",
    "ruff>=0.4",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "litellm>=1.81.15",
    "faker>=30.0.0",
    "huggingface_hub>=0.20.0",
    "datasets>=4.6.1",
    "datasets-shared @ git+https://huggingface.co/datasets/hyeon-expression/subscription-killer-synthetic-emails.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_benchmark"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["llm_benchmark", "dags", "tests", "cli.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (may require external services)",
]

[tool.pyright]
include = ["llm_benchmark", "dags", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
venvPath = "." 
venv = ".venv" # Replace with your env name if different
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.12.12" # Match your specific version
typeCheckingMode = "basic"
