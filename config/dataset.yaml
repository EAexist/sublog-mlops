oracle_model_id: groq/llama-3.1-8b-instant
output_dir: outputs/runs
mlflow_experiment_name: llm-benchmark
n_templates_per_event: 10
n_samples_per_template: 10
locales: ["en_US", "ja_JP", "ko_KR"]
do_update_templates: false
do_update_parameters: true
hf_repo: hyeon-expression/subscription-killer-synthetic-emails

# Dataset publishing settings
dataset_publishing:
  max_versions: 10          # versions kept in versions/ before archiving
  submodule_path: datasets  # relative path to submodule root
  remote_branch: main       # branch to push to in submodule remote

# Tasks: each task = one prompt/domain. task_type: task_a (categorize SubscriptionEventType) or task_b (extract regexes)
tasks:
  - task_id: task_a_categorize
    domain: subscription_email
    n_samples: 50
    weight: 1.0
    task_type: task_a
  - task_id: task_b_extract
    domain: subscription_email
    n_samples: 30
    weight: 0.8
    task_type: task_b
