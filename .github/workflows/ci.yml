# Lint (ruff), type-check (mypy), unit tests on push

name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy
        run: uv run mypy llm_benchmark dags cli.py --ignore-missing-imports

      - name: Unit tests
        run: uv run pytest tests/unit -v
