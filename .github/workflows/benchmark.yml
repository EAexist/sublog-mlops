# Manual trigger: spin up Airflow, run DAG, upload artifacts

name: Benchmark
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Start Airflow stack
        run: docker compose up -d
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Wait for Airflow
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:8080/health 2>/dev/null; do sleep 5; done' || true

      - name: Trigger DAG
        run: |
          airflow dags trigger benchmark_dag || true
          sleep 60

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-outputs
          path: outputs/runs/
          retention-days: 7
